[pytest]
testpaths = tests
# Repo root so `api.*` / `core.*` resolve, and `core/` itself because modules in
# there import each other as siblings (`from env_config import …`). That's the
# same fixup `api/jobs/handlers/search_run.py` does at runtime — see core/CLAUDE.md.
pythonpath = . core
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning:api.*
    error::DeprecationWarning:core.*
